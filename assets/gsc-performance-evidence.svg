<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Search Console performance evidence</title><desc id="desc">Search performance reporting visual showing clicks, impressions, click-through rate and average position.</desc><rect width="1200" height="800" rx="30" fill="#f8fafc"/><rect x="35" y="30" width="1130" height="100" rx="18" fill="#fff" stroke="#e2e8f0"/><text x="70" y="75" fill="#1e293b" font-family="Arial,sans-serif" font-size="28" font-weight="700">Performance</text><text x="70" y="105" fill="#64748b" font-family="Arial,sans-serif" font-size="15">Search type: Web · Date: Last 3 months</text><g font-family="Arial,sans-serif"><rect x="45" y="155" width="270" height="145" fill="#1683e6"/><rect x="315" y="155" width="270" height="145" fill="#4932a7"/><rect x="585" y="155" width="270" height="145" fill="#059669"/><rect x="855" y="155" width="300" height="145" fill="#e8790c"/><text x="70" y="195" fill="#fff" font-size="17">Total clicks</text><text x="70" y="255" fill="#fff" font-size="42" font-weight="700">17,125</text><text x="340" y="195" fill="#fff" font-size="17">Total impressions</text><text x="340" y="255" fill="#fff" font-size="42" font-weight="700">420,063</text><text x="610" y="195" fill="#fff" font-size="17">Average CTR</text><text x="610" y="255" fill="#fff" font-size="42" font-weight="700">4.05%</text><text x="880" y="195" fill="#111827" font-size="17">Average position</text><text x="880" y="255" fill="#111827" font-size="42" font-weight="700">12.4</text></g><rect x="45" y="330" width="1110" height="275" rx="18" fill="#fff" stroke="#e2e8f0"/><g stroke-width="3" fill="none"><polyline stroke="#4338ca" points="75,500 120,455 165,470 210,430 255,450 300,440 345,455 390,420 435,400 480,415 525,385 570,395 615,375 660,400 705,365 750,350 795,370 840,340 885,355 930,330 975,350 1020,320 1065,335 1120,300"/><polyline stroke="#3b82f6" points="75,545 120,520 165,530 210,510 255,525 300,500 345,510 390,480 435,495 480,475 525,490 570,465 615,480 660,455 705,470 750,445 795,455 840,430 885,445 930,420 975,435 1020,405 1065,420 1120,390"/><polyline stroke="#059669" points="75,565 120,550 165,555 210,540 255,548 300,530 345,535 390,520 435,528 480,510 525,518 570,500 615,508 660,490 705,498 750,480 795,488 840,470 885,480 930,462 975,470 1020,450 1065,458 1120,440"/><polyline stroke="#f97316" points="75,580 120,575 165,570 210,568 255,560 300,558 345,550 390,552 435,545 480,540 525,542 570,535 615,530 660,532 705,525 750,520 795,522 840,515 885,510 930,515 975,505 1020,508 1065,500 1120,495"/></g><g font-family="Arial,sans-serif" fill="#64748b" font-size="14"><text x="75" y="585">Mar 15, 2025</text><text x="350" y="585">Apr 10, 2025</text><text x="630" y="585">May 6, 2025</text><text x="910" y="585">Jun 12, 2025</text></g><text x="60" y="655" fill="#0f172a" font-family="Arial,sans-serif" font-size="24" font-weight="700">Evidence note</text><text x="60" y="690" fill="#64748b" font-family="Arial,sans-serif" font-size="16">Search performance metrics are time-bound and should be interpreted with the reporting period and search context.</text><text x="60" y="720" fill="#64748b" font-family="Arial,sans-serif" font-size="16">This visual is presented as supporting case-study evidence, not a guarantee of future rankings.</text></svg>