<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1080" role="img" aria-labelledby="title desc"><title id="title">Why SEO matters</title><desc id="desc">SEO strategy visual explaining discoverability, relevance, trust and measurable growth.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#e0f2fe"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-opacity=".12"/></filter></defs><rect width="900" height="1080" rx="38" fill="url(#bg)"/><text x="70" y="105" fill="#0f172a" font-family="Arial,sans-serif" font-size="48" font-weight="700">Why You Need SEO</text><text x="70" y="150" fill="#475569" font-family="Arial,sans-serif" font-size="20">Search visibility is built through connected signals, not one isolated trick.</text><g filter="url(#s)"><rect x="70" y="205" width="330" height="220" rx="28" fill="#fff"/><rect x="500" y="205" width="330" height="220" rx="28" fill="#fff"/><rect x="70" y="485" width="330" height="220" rx="28" fill="#fff"/><rect x="500" y="485" width="330" height="220" rx="28" fill="#fff"/><rect x="285" y="765" width="330" height="220" rx="28" fill="#fff"/></g><g font-family="Arial,sans-serif"><circle cx="235" cy="275" r="42" fill="#dbeafe"/><text x="215" y="290" fill="#2563eb" font-size="40" font-weight="700">1</text><text x="110" y="355" fill="#0f172a" font-size="25" font-weight="700">Discoverability</text><text x="110" y="388" fill="#64748b" font-size="16">Crawlable, indexable pages</text><circle cx="665" cy="275" r="42" fill="#fef3c7"/><text x="645" y="290" fill="#d97706" font-size="40" font-weight="700">2</text><text x="540" y="355" fill="#0f172a" font-size="25" font-weight="700">Relevance</text><text x="540" y="388" fill="#64748b" font-size="16">Intent-led content and structure</text><circle cx="235" cy="555" r="42" fill="#dcfce7"/><text x="215" y="570" fill="#16a34a" font-size="40" font-weight="700">3</text><text x="110" y="635" fill="#0f172a" font-size="25" font-weight="700">Trust</text><text x="110" y="668" fill="#64748b" font-size="16">Evidence, authority and credibility</text><circle cx="665" cy="555" r="42" fill="#ede9fe"/><text x="645" y="570" fill="#7c3aed" font-size="40" font-weight="700">4</text><text x="540" y="635" fill="#0f172a" font-size="25" font-weight="700">Measurement</text><text x="540" y="668" fill="#64748b" font-size="16">Search and engagement data</text><circle cx="450" cy="835" r="42" fill="#cffafe"/><text x="430" y="850" fill="#0891b2" font-size="40" font-weight="700">5</text><text x="350" y="915" fill="#0f172a" font-size="25" font-weight="700">Action</text><text x="350" y="948" fill="#64748b" font-size="16">Prioritize fixes and improvements</text></g><path d="M400 315H500M400 595H500M235 425V485M665 425V485M450 705V765" stroke="#94a3b8" stroke-width="5" stroke-dasharray="10 12"/></svg>