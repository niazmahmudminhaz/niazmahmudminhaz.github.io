<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="title desc"><title id="title">What quality means in a backlink</title><desc id="desc">A simple backlink-quality diagram showing topical relevance, referring-domain trust, link placement and anchor text pattern.</desc><rect width="900" height="340" fill="none"/><g fill="none" stroke="currentColor" stroke-width="2"><line x1="225" y1="170" x2="450" y2="170"/><line x1="675" y1="170" x2="450" y2="170"/><line x1="450" y1="170" x2="450" y2="65"/><line x1="450" y1="170" x2="450" y2="275"/></g><g fill="currentColor" font-family="Arial, sans-serif" text-anchor="middle"><circle cx="120" cy="170" r="46" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="780" cy="170" r="46" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="450" cy="170" r="58" fill="none" stroke="currentColor" stroke-width="3"/><text x="120" y="166" font-size="16">RELEVANCE</text><text x="120" y="186" font-size="12">Topic fit</text><text x="780" y="166" font-size="16">TRUST</text><text x="780" y="186" font-size="12">Source quality</text><text x="450" y="166" font-size="18">BACKLINK</text><text x="450" y="188" font-size="12">Useful editorial reference</text><text x="450" y="50" font-size="15">PLACEMENT</text><text x="450" y="70" font-size="11">Context matters</text><text x="450" y="294" font-size="15">ANCHOR</text><text x="450" y="314" font-size="11">Descriptive, natural</text></g></svg>