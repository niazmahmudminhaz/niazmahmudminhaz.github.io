name: One-time AEO credential update

on:
  push:
    paths:
      - '.github/trigger-aeo-credential.txt'

permissions:
  contents: write

jobs:
  update-aeo-credential:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add AEO Fundamentals credential link and clean up helper files
        env:
          AEO_URL: 'https://app-na2.hubspot.com/academy/achievements/5fmjmp7w/en/1/niaz-mahmud-minhaz/aeo-fundamentals'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('about/index.html')
          text = path.read_text(encoding='utf-8')
          old = '<article class="cert-card"><div class="cert-square"><span>AEO Fundamentals</span></div><div class="cert-meta"><p><strong>Certification name:</strong> AEO Fundamentals</p><p><strong>Provider:</strong> HubSpot Academy</p><span class="btn primary cert-showcase" aria-disabled="true">View Credential</span></div></article>'
          new = '<article class="cert-card"><div class="cert-square"><span>AEO Fundamentals</span></div><div class="cert-meta"><p><strong>Certification name:</strong> AEO Fundamentals</p><p><strong>Provider:</strong> HubSpot Academy</p><a class="btn primary cert-showcase" href="https://app-na2.hubspot.com/academy/achievements/5fmjmp7w/en/1/niaz-mahmud-minhaz/aeo-fundamentals" target="_blank" rel="noopener noreferrer">View Credential</a></div></article>'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one AEO card match, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm -f .github/trigger-aeo-credential.txt .github/workflows/update-aeo-credential.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add about/index.html .github/trigger-aeo-credential.txt .github/workflows/update-aeo-credential.yml
          git commit -m 'Add AEO Fundamentals credential link'
          git push
