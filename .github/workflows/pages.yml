name: Deploy GitHub Pages site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Normalize sitewide primary navigation
        shell: python
        run: |
          from pathlib import Path
          import re

          nav = '''<nav class="nav-links"><a href="/">Home</a><a href="/services/">Services</a><a href="/case-studies/">Case Studies</a><a href="/about/">About</a><a href="/insights/">Blogs</a><a href="/faq/">FAQ</a><a href="/contact/">Contacts</a><button id="themeToggle" class="theme-toggle" type="button">Dark / Light</button></nav>'''
          root = Path("_site")
          pattern = re.compile(r'<nav\s+class=["\']nav-links["\']>.*?</nav>', re.IGNORECASE | re.DOTALL)
          changed = 0
          for path in root.rglob("*.html"):
              text = path.read_text(encoding="utf-8")
              updated, count = pattern.subn(nav, text, count=1)
              if count:
                  if updated != text:
                      path.write_text(updated, encoding="utf-8")
                      changed += 1
              else:
                  raise SystemExit(f"Primary navigation block not found: {path}")
          print(f"Normalized primary navigation on {changed} HTML pages.")

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
