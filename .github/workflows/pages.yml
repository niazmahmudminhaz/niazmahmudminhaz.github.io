name: Deploy GitHub Pages site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Navigation is now taken directly from source files.
      # Do not rewrite page navigation during deployment.
      - name: Preserve source navigation
        if: ${{ false }}
        shell: python
        run: |
          print('Navigation rewrite intentionally disabled; preserving repository source.')

      # One canonical footer source is kept in _includes/footer.html.
      # Public email is intentionally not rendered in the footer.
      - name: Normalize shared footer
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')
          footer_path = root / '_includes' / 'footer.html'
          footer = footer_path.read_text(encoding='utf-8').strip()
          footer = re.sub(r'<p>[^<]*@[^<]*<br>', '<p>', footer, count=1)
          footer_pattern = re.compile(
              r'<footer\b[^>]*class=["\'][^"\']*site-footer[^"\']*["\'][^>]*>.*?</footer>',
              re.IGNORECASE | re.DOTALL,
          )
          body_pattern = re.compile(r'</body>', re.IGNORECASE)

          replaced = 0
          injected = 0
          checked = 0

          for path in root.rglob('*.html'):
              if any(part in {'.git', '_site', 'vendor', '_includes'} for part in path.parts):
                  continue

              checked += 1
              text = path.read_text(encoding='utf-8')

              if footer_pattern.search(text):
                  text, count = footer_pattern.subn(footer, text, count=1)
                  if count:
                      text = re.sub(r'<p><strong>Email:</strong>.*?</p>', '', text, count=1, flags=re.IGNORECASE | re.DOTALL)
                      path.write_text(text, encoding='utf-8')
                      replaced += 1
                  continue

              if body_pattern.search(text):
                  text = re.sub(r'<p><strong>Email:</strong>.*?</p>', '', text, count=1, flags=re.IGNORECASE | re.DOTALL)
                  text = body_pattern.sub(footer + '\n</body>', text, count=1)
                  path.write_text(text, encoding='utf-8')
                  injected += 1

          print(f'Checked {checked} source HTML files; canonicalized {replaced} footers and injected {injected} missing footers.')

      # Make the Web3Forms contact form independent of a missing Web3Forms
      # client bundle. Use the documented direct hCaptcha integration and the
      # existing Web3Forms API endpoint.
      - name: Normalize contact form protection and submission
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')
          external = '<script src="https://js.hcaptcha.com/1/api.js" async defer></script>\n<script src="/contact-form.js" defer></script>'
          body_pattern = re.compile(r'</body>', re.IGNORECASE)
          form_pattern = re.compile(r'<form\b[^>]*id=["\']seoContactForm["\'][^>]*>.*?</form>', re.IGNORECASE | re.DOTALL)
          old_script_pattern = re.compile(r'<script src=["\']https://web3forms\.com/client/script\.js["\'][^>]*></script>', re.IGNORECASE)
          old_inline_pattern = re.compile(r'<script>const form=document\.getElementById\(["\']seoContactForm["\']\).*?</script>', re.IGNORECASE | re.DOTALL)
          changed = 0

          for path in root.rglob('*.html'):
              if any(part in {'.git', '_site', 'vendor', '_includes'} for part in path.parts):
                  continue

              text = path.read_text(encoding='utf-8')
              if not re.search(r'id=["\']seoContactForm["\']', text, re.IGNORECASE):
                  continue

              original = text
              text = text.replace('<div class="h-captcha" data-captcha="true"></div>', '<div class="h-captcha" data-sitekey="50b2fe65-b00b-4b9e-ad62-3ba471098be2"></div>')
              if 'name="botcheck"' not in text:
                  text = text.replace('<input type="hidden" name="from_name" value="Niaz Mahmud Minhaz Website">', '<input type="hidden" name="from_name" value="Niaz Mahmud Minhaz Website"><input type="checkbox" name="botcheck" style="display:none">', 1)
              text = old_script_pattern.sub('', text)
              text = old_inline_pattern.sub('', text)
              if '/contact-form.js' not in text:
                  text = body_pattern.sub(external + '\n</body>', text, count=1)
              if 'js.hcaptcha.com/1/api.js' not in text:
                  text = body_pattern.sub('<script src="https://js.hcaptcha.com/1/api.js" async defer></script>\n</body>', text, count=1)

              text = re.sub(r'<p><strong>Email:</strong>.*?</p>', '', text, count=1, flags=re.IGNORECASE | re.DOTALL)

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed += 1

          print(f'Normalized {changed} contact-form page(s).')

      # Keep GA4 working from the writable source tree before Jekyll builds.
      - name: Prepare source HTML for Google Analytics 4
        shell: python
        run: |
          from pathlib import Path
          import re

          GA_TAG = '''<script async src="https://www.googletagmanager.com/gtag/js?id=G-DBXYK9VD3N"></script>
          <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', 'G-DBXYK9VD3N');
          </script>'''

          root = Path('.')
          head_pattern = re.compile(r"<head\b[^>]*>", re.IGNORECASE)
          existing_tag_pattern = re.compile(r"googletagmanager\.com/gtag/js\?id=G-DBXYK9VD3N", re.IGNORECASE)
          ga_include_pattern = re.compile(r"\{%\s*include\s+ga4\.html\s*%\}", re.IGNORECASE)
          csp_pattern = re.compile(r'(<meta\s+http-equiv=["\']Content-Security-Policy["\']\s+content=["\'])(.*?)(["\'])', re.IGNORECASE | re.DOTALL)

          def update_csp(match):
              prefix, policy, suffix = match.groups()
              additions = {
                  "script-src": ["https://www.googletagmanager.com"],
                  "connect-src": ["https://www.google-analytics.com", "https://*.google-analytics.com", "https://*.googletagmanager.com"],
              }
              for directive, values in additions.items():
                  pattern = re.compile(rf"(^|\s){re.escape(directive)}\s+([^;]*)", re.IGNORECASE)
                  dm = pattern.search(policy)
                  if dm:
                      tokens = dm.group(2).split()
                      for value in values:
                          if value not in tokens:
                              tokens.append(value)
                      policy = policy[:dm.start(2)] + ' '.join(tokens) + policy[dm.end(2):]
                  else:
                      policy += f"; {directive} 'self' {' '.join(values)}"
              return prefix + policy + suffix

          changed = 0
          files_checked = 0

          for path in root.rglob('*.html'):
              if any(part in {'.git', '_site', 'vendor', '_includes'} for part in path.parts):
                  continue
              files_checked += 1
              text = path.read_text(encoding='utf-8')
              original = text
              if not existing_tag_pattern.search(text) and not ga_include_pattern.search(text):
                  match = head_pattern.search(text)
                  if match:
                      text = text[:match.end()] + '\n' + GA_TAG + text[match.end():]
              if 'Content-Security-Policy' in text:
                  text = csp_pattern.sub(update_csp, text, count=1)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed += 1

          print(f'Prepared {files_checked} source HTML files; updated {changed} files for GA4.')

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4