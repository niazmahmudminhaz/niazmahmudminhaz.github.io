name: Deploy GitHub Pages site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Prepare the writable source tree before Jekyll builds it. The previous
      # workflow rewrote generated _site files after the build, which could
      # fail with PermissionError and prevent the Pages artifact from uploading.
      - name: Prepare source HTML for Google Analytics 4
        shell: python
        run: |
          from pathlib import Path
          import re

          GA_TAG = '''<script async src="https://www.googletagmanager.com/gtag/js?id=G-DBXYK9VD3N"></script>
          <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', 'G-DBXYK9VD3N');
          </script>'''

          root = Path('.')
          head_pattern = re.compile(r"<head\b[^>]*>", re.IGNORECASE)
          existing_tag_pattern = re.compile(
              r"googletagmanager\.com/gtag/js\?id=G-DBXYK9VD3N",
              re.IGNORECASE,
          )
          ga_include_pattern = re.compile(r"\{%\s*include\s+ga4\.html\s*%\}", re.IGNORECASE)
          csp_pattern = re.compile(
              r'(<meta\s+http-equiv=["\']Content-Security-Policy["\']\s+content=["\'])(.*?)(["\'])',
              re.IGNORECASE | re.DOTALL,
          )

          def update_csp(match):
              prefix, policy, suffix = match.groups()
              additions = {
                  "script-src": ["https://www.googletagmanager.com"],
                  "connect-src": [
                      "https://www.google-analytics.com",
                      "https://*.google-analytics.com",
                      "https://*.googletagmanager.com",
                  ],
              }

              for directive, values in additions.items():
                  pattern = re.compile(
                      rf"(^|\s){re.escape(directive)}\s+([^;]*)",
                      re.IGNORECASE,
                  )
                  dm = pattern.search(policy)
                  if dm:
                      current = dm.group(2)
                      tokens = current.split()
                      for value in values:
                          if value not in tokens:
                              tokens.append(value)
                      updated = " ".join(tokens)
                      policy = policy[:dm.start(2)] + updated + policy[dm.end(2):]
                  else:
                      policy += f"; {directive} 'self' {' '.join(values)}"

              return prefix + policy + suffix

          changed = 0
          files_checked = 0

          for path in root.rglob("*.html"):
              if any(part in {".git", "_site", "vendor"} for part in path.parts):
                  continue

              files_checked += 1
              text = path.read_text(encoding="utf-8")
              original = text

              # Pages using the Jekyll GA4 include already receive the tag at
              # render time. Do not inject a second tag into those source files.
              if not existing_tag_pattern.search(text) and not ga_include_pattern.search(text):
                  match = head_pattern.search(text)
                  if not match:
                      raise SystemExit(f"<head> not found in source HTML: {path}")
                  text = text[:match.end()] + "\n" + GA_TAG + text[match.end():]

              if "Content-Security-Policy" in text:
                  text = csp_pattern.sub(update_csp, text, count=1)

              if text != original:
                  path.write_text(text, encoding="utf-8")
                  changed += 1

          print(
              f"Prepared {files_checked} source HTML files; "
              f"updated {changed} files for GA4 (G-DBXYK9VD3N)."
          )

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      # Navigation is owned by the source pages/templates. Do not rewrite
      # generated _site HTML in the deployment pipeline.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
