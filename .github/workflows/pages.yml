name: Deploy GitHub Pages site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Normalize legacy hardcoded navigation in writable source files before Jekyll.
      # Certifications is intentionally not a top-level navigation item; it belongs
      # under the About silo. The Services control is rebuilt by service-silo.js.
      - name: Normalize site navigation
        shell: python
        run: |
          from pathlib import Path
          import re

          NAV = '''<nav class="nav-links">
            <a href="/">Home</a>
            <a href="/services/">Services</a>
            <a href="/about/">About</a>
            <a href="/case-studies/">Case Studies</a>
            <a href="/blog/">Blog</a>
            <a href="/faq/">FAQ</a>
            <a href="/contact/">Contact</a>
            <button id="themeToggle" class="theme-toggle" type="button">Dark / Light</button>
          </nav>'''

          root = Path('.')
          nav_pattern = re.compile(
              r'(<header\b[^>]*class=["\'][^"\']*site-header[^"\']*["\'][^>]*>.*?<div\b[^>]*class=["\'][^"\']*nav-wrap[^"\']*["\'][^>]*>.*?)'
              r'<nav\b[^>]*class=["\'][^"\']*nav-links[^"\']*["\'][^>]*>.*?</nav>',
              re.IGNORECASE | re.DOTALL,
          )

          changed = 0
          checked = 0

          for path in root.rglob('*.html'):
              if any(part in {'.git', '_site', 'vendor', '_includes'} for part in path.parts):
                  continue
              checked += 1
              text = path.read_text(encoding='utf-8')
              original = text

              def replace(match):
                  prefix = match.group(1)
                  return prefix + NAV

              text, count = nav_pattern.subn(replace, text, count=1)
              if count and text != original:
                  path.write_text(text, encoding='utf-8')
                  changed += 1

          print(f'Checked {checked} source HTML files; normalized navigation on {changed} files.')

      # Inject the same canonical 22-service silo on every real HTML page,
      # including legacy service pages that do not use the Jekyll nav include.
      # Front-matter-only redirect stubs are intentionally skipped.
      - name: Load canonical service silo
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')
          script_tag = '<script src="/service-silo.js" defer></script>'
          body_pattern = re.compile(r'</body>', re.IGNORECASE)
          changed = 0
          checked = 0
          skipped = 0

          for path in root.rglob('*.html'):
              if any(part in {'.git', '_site', 'vendor', '_includes'} for part in path.parts):
                  continue

              checked += 1
              text = path.read_text(encoding='utf-8')
              if '/service-silo.js' in text:
                  continue
              if not body_pattern.search(text):
                  skipped += 1
                  continue

              text = body_pattern.sub(script_tag + '\n</body>', text, count=1)
              path.write_text(text, encoding='utf-8')
              changed += 1

          print(f'Checked {checked} source HTML files; injected service-silo.js into {changed} files; skipped {skipped} redirect/non-page files.')

      # Prepare the writable source tree before Jekyll builds it. Keep the
      # established GA4 measurement and CSP logic, but skip front-matter-only
      # redirect stubs that do not contain a real HTML <head>.
      - name: Prepare source HTML for Google Analytics 4
        shell: python
        run: |
          from pathlib import Path
          import re

          GA_TAG = '''<script async src="https://www.googletagmanager.com/gtag/js?id=G-DBXYK9VD3N"></script>
          <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', 'G-DBXYK9VD3N');
          </script>'''

          root = Path('.')
          head_pattern = re.compile(r"<head\b[^>]*>", re.IGNORECASE)
          existing_tag_pattern = re.compile(
              r"googletagmanager\.com/gtag/js\?id=G-DBXYK9VD3N",
              re.IGNORECASE,
          )
          ga_include_pattern = re.compile(r"\{%\s*include\s+ga4\.html\s*%\}", re.IGNORECASE)
          csp_pattern = re.compile(
              r'(<meta\s+http-equiv=["\']Content-Security-Policy["\']\s+content=["\'])(.*?)(["\'])',
              re.IGNORECASE | re.DOTALL,
          )

          def update_csp(match):
              prefix, policy, suffix = match.groups()
              additions = {
                  "script-src": ["https://www.googletagmanager.com"],
                  "connect-src": [
                      "https://www.google-analytics.com",
                      "https://*.google-analytics.com",
                      "https://*.googletagmanager.com",
                  ],
              }

              for directive, values in additions.items():
                  pattern = re.compile(
                      rf"(^|\s){re.escape(directive)}\s+([^;]*)",
                      re.IGNORECASE,
                  )
                  dm = pattern.search(policy)
                  if dm:
                      current = dm.group(2)
                      tokens = current.split()
                      for value in values:
                          if value not in tokens:
                              tokens.append(value)
                      updated = " ".join(tokens)
                      policy = policy[:dm.start(2)] + updated + policy[dm.end(2):]
                  else:
                      policy += f"; {directive} 'self' {' '.join(values)}"

              return prefix + policy + suffix

          changed = 0
          files_checked = 0
          skipped = 0

          for path in root.rglob("*.html"):
              if any(part in {".git", "_site", "vendor", "_includes"} for part in path.parts):
                  continue

              files_checked += 1
              text = path.read_text(encoding="utf-8")
              original = text

              if not existing_tag_pattern.search(text) and not ga_include_pattern.search(text):
                  match = head_pattern.search(text)
                  if not match:
                      skipped += 1
                      continue
                  text = text[:match.end()] + "\n" + GA_TAG + text[match.end():]

              if "Content-Security-Policy" in text:
                  text = csp_pattern.sub(update_csp, text, count=1)

              if text != original:
                  path.write_text(text, encoding="utf-8")
                  changed += 1

          print(
              f"Prepared {files_checked} source HTML files; "
              f"updated {changed} files for GA4 (G-DBXYK9VD3N); skipped {skipped} files without a real <head>."
          )

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
