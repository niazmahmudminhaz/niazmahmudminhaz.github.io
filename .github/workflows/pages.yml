name: Deploy GitHub Pages site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Make the Web3Forms contact form independent of a missing Web3Forms
      # client bundle. Use the documented direct hCaptcha integration and the
      # existing Web3Forms API endpoint.
      - name: Normalize contact form protection and submission
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')
          external = '<script src="https://js.hcaptcha.com/1/api.js" async defer></script>\n<script src="/contact-form.js" defer></script>'
          body_pattern = re.compile(r'</body>', re.IGNORECASE)
          old_script_pattern = re.compile(r'<script src=["\']https://web3forms\.com/client/script\.js["\'][^>]*></script>', re.IGNORECASE)
          old_inline_pattern = re.compile(r'<script>const form=document\.getElementById\(["\']seoContactForm["\']\).*?</script>', re.IGNORECASE | re.DOTALL)
          changed = 0

          for path in root.rglob('*.html'):
              if any(part in {'.git', '_site', 'vendor', '_includes'} for part in path.parts):
                  continue

              text = path.read_text(encoding='utf-8')
              if not re.search(r'id=["\']seoContactForm["\']', text, re.IGNORECASE):
                  continue

              original = text
              text = text.replace('<div class="h-captcha" data-captcha="true"></div>', '<div class="h-captcha" data-sitekey="50b2fe65-b00b-4b9e-ad62-3ba471098be2"></div>')
              if 'name="botcheck"' not in text:
                  text = text.replace('<input type="hidden" name="from_name" value="Niaz Mahmud Minhaz Website">', '<input type="hidden" name="from_name" value="Niaz Mahmud Minhaz Website"><input type="checkbox" name="botcheck" style="display:none">', 1)
              text = old_script_pattern.sub('', text)
              text = old_inline_pattern.sub('', text)
              if '/contact-form.js' not in text:
                  text = body_pattern.sub(external + '\n</body>', text, count=1)
              if 'js.hcaptcha.com/1/api.js' not in text:
                  text = body_pattern.sub('<script src="https://js.hcaptcha.com/1/api.js" async defer></script>\n</body>', text, count=1)
              text = re.sub(r'<p><strong>Email:</strong>.*?</p>', '', text, count=1, flags=re.IGNORECASE | re.DOTALL)

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed += 1

          print(f"Normalized {changed} contact-form page(s).")

      # Inject analytics and GTM into the writable source tree before Jekyll builds.
      # This preserves page-owned HTML while guaranteeing sitewide deployment.
      - name: Prepare source HTML for Google Analytics 4 and Google Tag Manager
        shell: python
        run: |
          from pathlib import Path
          import re

          GA_TAG = '''<script async src="https://www.googletagmanager.com/gtag/js?id=G-DBXYK9VD3N"></script>
          <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', 'G-DBXYK9VD3N');
          </script>'''

          GTM_HEAD = '''<!-- Google Tag Manager -->
          <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
          new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
          j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
          'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
          })(window,document,'script','dataLayer','GTM-NKHP3LS4');</script>
          <!-- End Google Tag Manager -->'''

          GTM_BODY = '''<!-- Google Tag Manager (noscript) -->
          <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NKHP3LS4"
          height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
          <!-- End Google Tag Manager (noscript) -->'''

          root = Path('.')
          head_pattern = re.compile(r"<head\b[^>]*>", re.IGNORECASE)
          body_pattern = re.compile(r"<body\b[^>]*>", re.IGNORECASE)
          existing_ga_pattern = re.compile(r"googletagmanager\.com/gtag/js\?id=G-DBXYK9VD3N", re.IGNORECASE)
          ga_include_pattern = re.compile(r"\{%\s*include\s+ga4\.html\s*%\}", re.IGNORECASE)
          existing_gtm_head_pattern = re.compile(r"googletagmanager\.com/gtm\.js\?id=GTM-NKHP3LS4", re.IGNORECASE)
          existing_gtm_body_pattern = re.compile(r"googletagmanager\.com/ns\.html\?id=GTM-NKHP3LS4", re.IGNORECASE)
          csp_pattern = re.compile(r'(<meta\s+http-equiv=["\']Content-Security-Policy["\']\s+content=["\'])(.*?)(["\'])', re.IGNORECASE | re.DOTALL)

          def update_csp(match):
              prefix, policy, suffix = match.groups()
              additions = {
                  "script-src": ["https://www.googletagmanager.com"],
                  "connect-src": ["https://www.google-analytics.com", "https://*.google-analytics.com", "https://*.googletagmanager.com"],
                  "frame-src": ["https://www.googletagmanager.com"],
              }
              for directive, values in additions.items():
                  pattern = re.compile(rf"(^|\s){re.escape(directive)}\s+([^;]*)", re.IGNORECASE)
                  dm = pattern.search(policy)
                  if dm:
                      tokens = dm.group(2).split()
                      for value in values:
                          if value not in tokens:
                              tokens.append(value)
                      policy = policy[:dm.start(2)] + ' '.join(tokens) + policy[dm.end(2):]
                  else:
                      policy += f"; {directive} 'self' {' '.join(values)}"
              return prefix + policy + suffix

          changed = 0
          files_checked = 0
          gtm_head_injected = 0
          gtm_body_injected = 0

          for path in root.rglob('*.html'):
              if any(part in {'.git', '_site', 'vendor', '_includes'} for part in path.parts):
                  continue
              files_checked += 1
              text = path.read_text(encoding='utf-8')
              original = text

              if not existing_ga_pattern.search(text) and not ga_include_pattern.search(text):
                  match = head_pattern.search(text)
                  if match:
                      text = text[:match.end()] + '\n' + GA_TAG + text[match.end():]

              if not existing_gtm_head_pattern.search(text):
                  match = head_pattern.search(text)
                  if match:
                      text = text[:match.end()] + '\n' + GTM_HEAD + text[match.end():]
                      gtm_head_injected += 1

              if not existing_gtm_body_pattern.search(text):
                  match = body_pattern.search(text)
                  if match:
                      text = text[:match.end()] + '\n' + GTM_BODY + text[match.end():]
                      gtm_body_injected += 1

              if 'Content-Security-Policy' in text:
                  text = csp_pattern.sub(update_csp, text, count=1)

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed += 1

          print(f"Prepared {files_checked} source HTML files; updated {changed} files for GA4/GTM.")
          print(f"Injected GTM head snippet into {gtm_head_injected} page(s) and GTM body fallback into {gtm_body_injected} page(s).")

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      # Verify only real document pages. Jekyll also generates redirect-only HTML
      # files with no <head>/<body>; those are not content pages and do not need GTM.
      - name: Verify sitewide Google Tag Manager installation
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('_site')
          html_files = sorted(root.rglob('*.html'))
          if not html_files:
              raise SystemExit('No generated HTML files found in _site.')

          gtm_head_regex = re.compile(r"https://www\.googletagmanager\.com/gtm\.js\?id=\\?['\"]?\+?i\+?dl", re.IGNORECASE)
          gtm_head_fallback = "https://www.googletagmanager.com/gtm.js?id="
          gtm_body_marker = 'https://www.googletagmanager.com/ns.html?id=GTM-NKHP3LS4'
          checked = 0
          failures = []

          for path in html_files:
              text = path.read_text(encoding='utf-8')
              head_match = re.search(r'<head\b[^>]*>(.*?)</head>', text, re.IGNORECASE | re.DOTALL)
              body_match = re.search(r'<body\b[^>]*>(.*?)</body>', text, re.IGNORECASE | re.DOTALL)
              if not head_match or not body_match:
                  continue

              checked += 1
              head = head_match.group(1)
              body = body_match.group(1)
              head_ok = 'https://www.googletagmanager.com/gtm.js?id=' in head and "'GTM-NKHP3LS4'" in head
              body_ok = gtm_body_marker in body
              head_count = head.count('https://www.googletagmanager.com/gtm.js?id=')
              body_count = body.count(gtm_body_marker)

              if not head_ok or not body_ok or head_count != 1 or body_count != 1:
                  failures.append(f'{path}: head_count={head_count}, body_count={body_count}, head_ok={head_ok}, body_ok={body_ok}')

          if failures:
              print('\n'.join(failures))
              raise SystemExit(f'GTM verification failed for {len(failures)} real document page(s).')

          print(f'GTM verification passed for all {checked} real document page(s). Redirect-only generated files were excluded.')

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
