name: Apply Global UI Enhancements

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enhance-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply shared interaction layer
        shell: bash
        run: |
          set -euo pipefail

          CSS_MARKER='/* MINHAZ GLOBAL INTERACTION LAYER v1 */'
          JS_MARKER='/* MINHAZ GLOBAL POINTER INTERACTION v1 */'

          if ! grep -Fq "$CSS_MARKER" style.css; then
            cat >> style.css <<'CSS'

/* MINHAZ GLOBAL INTERACTION LAYER v1 */
:root{--pointer-x:50vw;--pointer-y:25vh;--ui-glow:color-mix(in srgb,var(--accent) 16%,transparent)}
body{position:relative;overflow-x:hidden}
body:before{content:'';position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(420px circle at var(--pointer-x) var(--pointer-y),var(--ui-glow),transparent 72%);opacity:0;transition:opacity .35s ease;mix-blend-mode:screen}
body.pointer-ready:before{opacity:.82}
body.pointer-hover:before{opacity:1}
.site-header,main,.site-footer{position:relative;z-index:2}
@media (hover:hover) and (pointer:fine){
  .btn,.theme-toggle,.menu-toggle,.nav-links a,.logo{transition:transform .2s ease,box-shadow .2s ease,color .2s ease,border-color .2s ease}
  .btn:hover{transform:translateY(-2px) scale(1.012)}
  .nav-links a:hover,.logo:hover{transform:translateY(-1px)}
  .cards article,.service-grid article,.topic-card,.article-card,.profile-card,.contact-form,.faq-item,.steps>div{transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease,background-color .25s ease}
  .cards article:hover,.service-grid article:hover,.topic-card:hover,.article-card:hover,.profile-card:hover,.contact-form:hover,.faq-item:hover,.steps>div:hover{border-color:color-mix(in srgb,var(--accent) 30%,var(--line));box-shadow:0 26px 80px color-mix(in srgb,var(--accent) 9%,transparent)}
  .page:before,.section:not(.section-alt):before,.contact-shell:before{content:'';position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(color-mix(in srgb,var(--line) 42%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--line) 42%,transparent) 1px,transparent 1px);background-size:72px 72px;mask-image:linear-gradient(to bottom,transparent,rgba(0,0,0,.42) 22%,transparent 82%);opacity:.13}
}
@media (max-width:900px){body:before{background:radial-gradient(300px circle at var(--pointer-x) var(--pointer-y),var(--ui-glow),transparent 72%);opacity:0!important}.page:before,.section:not(.section-alt):before,.contact-shell:before{display:none}}
@media (prefers-reduced-motion:reduce){body:before{transition:none}.btn,.theme-toggle,.menu-toggle,.nav-links a,.logo,.cards article,.service-grid article,.topic-card,.article-card,.profile-card,.contact-form,.faq-item,.steps>div{transition:none!important}.btn:hover,.nav-links a:hover,.logo:hover{transform:none!important}}
CSS
          fi

          if ! grep -Fq "$JS_MARKER" script.js; then
            cat >> script.js <<'JS'

/* MINHAZ GLOBAL POINTER INTERACTION v1 */
(()=>{
  const root=document.documentElement;
  const body=document.body;
  if(!body||window.matchMedia('(prefers-reduced-motion: reduce)').matches||!window.matchMedia('(pointer:fine)').matches)return;
  let raf=0,x=innerWidth*.5,y=innerHeight*.25,tx=x,ty=y;
  const tick=()=>{x+=(tx-x)*.12;y+=(ty-y)*.12;root.style.setProperty('--pointer-x',x+'px');root.style.setProperty('--pointer-y',y+'px');raf=(Math.abs(tx-x)+Math.abs(ty-y)>.2)?requestAnimationFrame(tick):0};
  addEventListener('pointermove',e=>{tx=e.clientX;ty=e.clientY;body.classList.add('pointer-ready');if(!raf)raf=requestAnimationFrame(tick)},{passive:true});
  addEventListener('pointerout',e=>{if(!e.relatedTarget)body.classList.remove('pointer-hover')},{passive:true});
  document.addEventListener('pointerover',e=>{body.classList.toggle('pointer-hover',!!e.target.closest('a,button,summary,.cards article,.service-grid article,.topic-card,.article-card,.profile-card,.contact-form,.faq-item,.steps>div'))},{passive:true});
  document.querySelectorAll('.cards article,.service-grid article,.topic-card,.article-card,.profile-card,.contact-form,.faq-item,.steps>div').forEach(card=>{
    card.addEventListener('pointermove',e=>{const r=card.getBoundingClientRect(),px=(e.clientX-r.left)/r.width-.5,py=(e.clientY-r.top)/r.height-.5;card.style.transform=`translateY(-4px) perspective(900px) rotateX(${(-py*2.2).toFixed(2)}deg) rotateY(${(px*2.2).toFixed(2)}deg)`},{passive:true});
    card.addEventListener('pointerleave',()=>{card.style.removeProperty('transform')},{passive:true});
  });
})();
JS
          fi

          rm -f interaction.js
          rm -f interaction.css

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add style.css script.js
          git add -A
          if git diff --cached --quiet; then
            echo 'No UI changes required.'
          else
            git commit -m 'Apply global cursor interactions and UI polish'
            git push
          fi
