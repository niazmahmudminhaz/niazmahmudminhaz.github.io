name: Update Analytics Credential Link

on:
  push:
    paths:
      - '.github/trigger-analytics-credential.txt'

permissions:
  contents: write

jobs:
  update-link:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Replace Analytics credential URL
        shell: python
        run: |
          from pathlib import Path

          path = Path('about/index.html')
          text = path.read_text(encoding='utf-8')
          old = 'https://skillshop.credential.net/profile/niazmahmud/wallet'
          new = 'https://skillshop.credential.net/5b9b2bf1-b9be-4fd3-bf10-daa81b07905a#acc.28N7VRZh'

          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly 1 old Analytics credential URL, found {count}')

          path.write_text(text.replace(old, new), encoding='utf-8')

      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add about/index.html
          git commit -m 'Update Google Analytics credential link'
          git push
