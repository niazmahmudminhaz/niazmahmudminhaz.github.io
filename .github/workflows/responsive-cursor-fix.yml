name: Fix Responsive Layout and Cursor Bubble

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply responsive and cursor fixes
        shell: bash
        run: |
          set -euo pipefail

          CSS_MARKER='/* MINHAZ RESPONSIVE + CURSOR FIX v2 */'
          if ! grep -Fq "$CSS_MARKER" style.css; then
            cat >> style.css <<'CSS'

/* MINHAZ RESPONSIVE + CURSOR FIX v2 */
html,body{max-width:100%;overflow-x:hidden}
main,.container,.hero,.page,.section,.contact-shell,.site-footer{max-width:100%;min-width:0}
.hero-copy,.hero-media,.section-intro,.prose,.contact-copy,.contact-form,.cards,.service-grid,.article-grid,.topic-grid,.steps,.fx-home-intel,.fx-about-intel,.fx-contact-intel,.fx-intel-grid,.fx-intel-panel{min-width:0;max-width:100%}
.cards article,.service-grid article,.article-card,.topic-card,.steps>div,.faq-item,.footer-grid>div{min-width:0}
.cards article p,.service-grid article p,.article-card p,.topic-card p,.steps>div,.faq-answer,.footer-brand,.footer-links{overflow-wrap:anywhere}
.fx-intel-panel{box-sizing:border-box;overflow:hidden}
.fx-signal-list{min-width:0}
.fx-signal-list li{min-width:0;overflow-wrap:anywhere}
.contact-shell .contact-layout{box-sizing:border-box;width:min(1120px,calc(100% - 36px));margin-inline:auto}
.site-footer>.container{box-sizing:border-box;width:min(1120px,calc(100% - 36px));margin-inline:auto}

@media(max-width:900px){
  .hero{grid-template-columns:1fr;gap:32px;min-height:auto}
  .hero-media{justify-content:center}
  .profile-card{width:min(100%,520px)}
  .contact-shell .contact-layout{width:min(100% - 28px,1120px)}
  .site-footer>.container{width:min(100% - 28px,1120px)}
  .fx-home-intel,.fx-about-intel,.fx-contact-intel{width:min(100% - 28px,1120px)}
}

@media(max-width:800px){
  body{background-attachment:scroll}
  .hero{padding:52px 0 54px}
  .section{padding:58px 0}
  .page{padding:54px 0}
  .contact-shell{padding:54px 0 60px}
  .contact-shell .contact-layout{width:calc(100% - 28px);gap:30px}
  .contact-form{width:100%;padding:18px}
  .fx-home-intel,.fx-about-intel,.fx-contact-intel{width:calc(100% - 28px)}
  .fx-intel-grid,.fx-about-intel .fx-intel-grid,.fx-contact-intel .fx-intel-grid{grid-template-columns:1fr;gap:14px}
  .fx-intel-panel{padding:22px}
  .site-footer>.container{width:calc(100% - 28px)}
  .site-footer{width:100%;padding:38px 0 22px}
  .footer-grid{width:100%;grid-template-columns:1fr 1fr;gap:24px 18px}
  .footer-brand{grid-column:1/-1}
}

@media(max-width:520px){
  .container{width:calc(100% - 24px)}
  .hero{padding:44px 0 48px}
  .hero h1{font-size:clamp(2.35rem,11vw,4rem);max-width:100%}
  .lead{font-size:1rem}
  .actions{width:100%}
  .actions .btn{width:100%;max-width:100%}
  .section{padding:50px 0}
  .page{padding:48px 0}
  .contact-shell{padding:48px 0 54px}
  .contact-shell .contact-layout{width:calc(100% - 24px)}
  .contact-copy h1{font-size:clamp(2.35rem,11vw,4rem)}
  .fx-home-intel,.fx-about-intel,.fx-contact-intel{width:calc(100% - 24px)}
  .fx-intel-panel{padding:20px}
  .fx-tags{gap:7px}
  .fx-tags span{font-size:.72rem;padding:6px 9px}
  .site-footer>.container{width:calc(100% - 24px)}
  .footer-grid{grid-template-columns:1fr;gap:22px}
  .footer-brand{grid-column:auto}
}
CSS
          fi

          python - <<'PY'
          from pathlib import Path
          p=Path('script.js')
          s=p.read_text(encoding='utf-8')
          old="const glow=document.createElement('div');glow.className='fx-cursor-glow';document.body.appendChild(glow);"
          new="const glow={style:{set transform(v){}}};"
          if old in s:
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add style.css script.js
          if git diff --cached --quiet; then
            echo 'No responsive/cursor changes required.'
          else
            git commit -m 'Fix responsive layout and remove cursor bubble'
            git push
          fi
