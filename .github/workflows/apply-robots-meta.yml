name: Apply robots meta tags

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-robots-meta:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update every index.html
        shell: python
        run: |
          from pathlib import Path
          import re

          tag = '<meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">'
          pattern = re.compile(r'\s*<meta\s+name=["\']robots["\'][^>]*>\s*', re.I)

          changed = []
          for path in Path('.').rglob('index.html'):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              if '<head' not in text.lower() or '</head>' not in text.lower():
                  raise SystemExit(f'Missing head section: {path}')

              updated, count = pattern.subn('\n    ' + tag + '\n', text, count=1)
              if count == 0:
                  head_end = re.search(r'</head>', updated, re.I)
                  if not head_end:
                      raise SystemExit(f'Missing closing head: {path}')
                  updated = updated[:head_end.start()] + '    ' + tag + '\n' + updated[head_end.start():]

              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print(f'Updated {len(changed)} index.html files:')
          for item in changed:
              print(item)

      - name: Verify exactly one robots meta tag per index.html
        shell: python
        run: |
          from pathlib import Path
          import re

          expected = '<meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">'
          pattern = re.compile(r'<meta\s+name=["\']robots["\'][^>]*>', re.I)

          pages = list(Path('.').rglob('index.html'))
          if len(pages) != 26:
              raise SystemExit(f'Expected 26 index.html files, found {len(pages)}')

          for path in pages:
              text = path.read_text(encoding='utf-8')
              matches = pattern.findall(text)
              if len(matches) != 1 or matches[0] != expected:
                  raise SystemExit(f'Robots meta verification failed: {path}')

          print('Verified exactly one requested robots meta tag in all 26 index.html files.')

      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-robots-meta.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          git add -u .github/workflows/apply-robots-meta.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add explicit robots meta directives to all pages"
          git push origin HEAD:main
